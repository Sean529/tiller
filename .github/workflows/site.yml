# Publishes site/ to the gh-pages branch, which GitHub Pages serves at
# https://sorrycc.github.io/Tiller/. The branch also holds appcast.xml, written
# by scripts/release.sh, and promo.mp4, kept out of main for its size; both
# stay as they are. Like release.sh, it commits without checking the branch out.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: site

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Commit site/ to gh-pages
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          site="$(git rev-parse HEAD:site)"
          names="$(git ls-tree --name-only "$site")"
          # A release can push gh-pages at the same time, so rebuild on the
          # newest gh-pages and try again when the push is rejected.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin gh-pages
            base="$(git rev-parse FETCH_HEAD)"
            kept="$(git ls-tree "$base" | while IFS= read -r line; do
              printf '%s\n' "$names" | grep -q -x -F -- "${line#*$'\t'}" || printf '%s\n' "$line"
            done)"
            tree="$(printf '%s\n%s\n' "$kept" "$(git ls-tree "$site")" | sed '/^$/d' | git mktree)"
            if [ "$tree" = "$(git rev-parse "$base^{tree}")" ]; then
              echo "gh-pages already has this site"; exit 0
            fi
            commit="$(git commit-tree "$tree" -p "$base" -m "Publish the site from ${GITHUB_SHA::7}")"
            if git push --quiet origin "$commit:refs/heads/gh-pages"; then
              echo "published $commit"; exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not push gh-pages" >&2; exit 1
